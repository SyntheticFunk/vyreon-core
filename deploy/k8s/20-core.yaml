# vyreon-core: one replica (it is the only writer and publishes one bundle at a time). It migrates
# the database before it serves. Reachable only inside the cluster, as http://vyreon-core:8080.
# Secret `vyreon-core` (made by hand, see README): `worker-token-sha256`. Secret `vyreon-core-webhook`
# (key `webhook`: the Discord channel's webhook URL, made by hand from a file, never printed) is
# mounted read-only; while it is absent the channel's posts wait unsent (C-050). Secret
# `vyreon-core-progress-webhook` (key `webhook`: the progress channel's webhook URL, made by hand
# from a file the same way, never printed) is mounted read-only; while it is absent nothing is
# composed or posted for that channel (C-065). Secret
# `vyreon-core-spaces` (keys `key-id` and `secret`: a Spaces access key limited to the bucket, made
# by hand from files, never printed; README "Perishable archive") is mounted read-only; the archive
# (C-052) is on only when its five settings below are uncommented and the Secret exists.
# C-068 round 2: core reads the backup plugin's own record (the database's Cluster and the
# ObjectStore it archives to) through the Kubernetes API, as the evidence that WAL is archived and a
# base backup is recoverable. Its service account may `get` those two kinds in this namespace, and
# (C-091) pods, to say why a worker's lease was lost; nothing else.
# C-078: secret `vyreon-core-do-billing` (key `token`: a DigitalOcean custom-scoped token with
# `billing:read` only, made by the owner in DigitalOcean's control panel and put in the cluster from
# a file, never printed; README "Spend") is mounted read-only; while it is absent the morning's spend
# line says the spend is not known and nothing alerts on it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vyreon-core
  namespace: vyreon
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vyreon-core-backup-reader
  namespace: vyreon
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get"]
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores"]
    verbs: ["get"]
  # C-091: a worker's pod, read when its lease is lost, for the cause (killed for memory, evicted, gone)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vyreon-core-backup-reader
  namespace: vyreon
subjects:
  - {kind: ServiceAccount, name: vyreon-core, namespace: vyreon}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: vyreon-core-backup-reader}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vyreon-core
  namespace: vyreon
spec:
  # one core at a time (C-053): a second pod refuses to serve while this one holds the database's
  # single-instance lock, so a rollout stops the old pod first
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: vyreon-core}
  template:
    metadata:
      labels: {app: vyreon-core}
    spec:
      # the image's user (deploy/core/Dockerfile): the webhook's file is readable by its group only
      securityContext: {fsGroup: 10001}
      # C-068 round 2: reads the backup plugin's record (the Role above), nothing else
      serviceAccountName: vyreon-core
      imagePullSecrets: [{name: regcred}]   # its own account has no pull secret (the default account carries it)
      automountServiceAccountToken: true
      initContainers:
        - name: migrate
          image: VYREON_CORE_IMAGE
          args: ["migrate"]
          env:
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: vyreon-pg-app, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: vyreon-pg-app, key: password}}
            - name: VYREON_CORE_PG
              value: "host=vyreon-pg-rw port=5432 dbname=vyreon user=$(PGUSER) password=$(PGPASSWORD)"
      containers:
        - name: core
          image: VYREON_CORE_IMAGE
          args: ["serve"]
          env:
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: vyreon-pg-app, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: vyreon-pg-app, key: password}}
            - name: VYREON_CORE_PG
              value: "host=vyreon-pg-rw port=5432 dbname=vyreon user=$(PGUSER) password=$(PGPASSWORD)"
            - name: VYREON_CORE_WORKER_TOKEN_SHA256
              valueFrom: {secretKeyRef: {name: vyreon-core, key: worker-token-sha256}}
            - name: VYREON_CORE_LEASE_SECONDS
              value: "600"
            # the owner's channel (C-050)
            - name: VYREON_CORE_WEBHOOK_FILE
              value: /etc/vyreon-core/webhook/webhook
            # the progress channel (C-065): every 30 minutes, silently, what moved (days published
            # with their counts, blocks started and done, the log, the queue's counts); optional
            - name: VYREON_CORE_PROGRESS_WEBHOOK_FILE
              value: /etc/vyreon-core/progress-webhook/webhook
            # C-073 (owner, 2026-11-24): the progress post's headline ("🟢 Phase 1: 4 of 597 days published ...")
            - name: VYREON_CORE_PROGRESS_LABEL
              value: "Phase 1"
            # the phase's sessions, the headline's total (597: 2024-07-09..2026-11-20, C-060)
            - name: VYREON_CORE_PROGRESS_FROM
              value: "2024-07-09"
            - name: VYREON_CORE_PROGRESS_TO
              value: "2026-11-20"
            - name: VYREON_CORE_VOLUME_GIB      # 10-postgres.yaml's storage size
              value: "250"
            # C-068: the newest recoverable base backup (the plugin's record, below) older than this
            # many days, or none, or the record unread, is a problem (the weekly schedule plus a
            # day); the WAL archiving and the volume's WAL are watched with the volume. Needs
            # `GRANT pg_monitor TO vyreon` (README, Backups B0)
            - name: VYREON_CORE_BACKUP_MAX_DAYS
              value: "8"
            # C-068 round 2: the Cluster whose backup plugin record is the evidence (read every 5 min)
            - name: VYREON_CORE_PG_CLUSTER
              value: vyreon-pg
            # Intrinio requests a minute shared through core's leases (C-025): 2,000 is the
            # provider's limit for the whole account, every node shares it; 1,900 (owner, 2026-11-21)
            - name: VYREON_CORE_INTRINIO_PER_MINUTE
              value: "1900"
            # C-095 (owner, 2026-11-26): requests a minute kept free for the daily session's work while it is
            # drawing (the nightly holds the only inputs that cannot be fetched later); the backfill sees 1,300 then
            - name: VYREON_CORE_INTRINIO_DAILY_RESERVE
              value: "600"
            # The reference check (C-054): from this session a published day with no report is a
            # problem; phase 1's first session
            - name: VYREON_CORE_REFCHECK_FROM
              value: "2024-07-09"
            # C-073: a published day from VYREON_CORE_REFCHECK_FROM with no completed check, its
            # worker gone, gets a re-run (a REFCHECK job, ScaledJob `refcheck`) this many hours after
            # publishing; REFCHECK_NOT_RUN only when that fails too. `off`: none (the old alert)
            - name: VYREON_CORE_REFCHECK_RERUN_HOURS
              value: "off"   # "off" 2026-11-25 and again 2026-11-26 (owner: backfill stopped until the engine is frozen again); "6" when the backfill resumes
            # Daily runs (C-051): core queues each session from VYREON_CORE_DAILY_FROM by itself, at
            # 07:30 New York the next calendar day, for the admitted build VYREON_CORE_DAILY_BUILD
            # (both or neither; unset, nothing is queued and the backfill is scheduled by hand).
            # The publishing deadlines (C-050) then start at the same session unless
            # VYREON_CORE_DEADLINES_FROM says otherwise; each session is due by
            # VYREON_CORE_DEADLINE_HOUR (20:00 MT) the next calendar day.
            # Switched on with phase 1 (owner's go, 2026-11-23); deadlines from 2026-11-30 so the
            # backfill raises none (the daily pass waits behind the backfill's passes, C-046).
            - name: VYREON_CORE_DAILY_FROM
              value: "2026-11-23"
            - name: VYREON_CORE_DAILY_BUILD
              value: "714e47a3+5b2beb37d0c5"
            - name: VYREON_CORE_DEADLINES_FROM
              value: "2026-11-30"
            - name: VYREON_CORE_DEADLINE_HOUR
              value: "20"
            # The perishable archive (C-052): workers upload a published day's cohort prints and
            # ACT01 pulls to the bucket through URLs core signs with this key (all five or none;
            # off by default). VYREON_CORE_ARCHIVE_FROM: the first session whose published day must
            # have its archives (default: VYREON_CORE_DAILY_FROM); VYREON_CORE_ARCHIVE_ALERT_DAYS:
            # a missing archive older than this is a problem on the channel (unset: only counted
            # in the digest; the provider keeps the prints about five sessions).
            - name: VYREON_CORE_SPACES_ENDPOINT
              value: "https://nyc3.digitaloceanspaces.com"
            - name: VYREON_CORE_SPACES_REGION
              value: "nyc3"
            - name: VYREON_CORE_SPACES_BUCKET
              value: "vyreon-data"
            - name: VYREON_CORE_SPACES_KEY_ID_FILE
              value: /etc/vyreon-core/spaces/key-id
            - name: VYREON_CORE_SPACES_SECRET_FILE
              value: /etc/vyreon-core/spaces/secret
            # - name: VYREON_CORE_ARCHIVE_ALERT_DAYS
            #   value: "2"
            # C-078: the spend since the owner's start against the ceiling (owner, 2026-11-21: $500 in
            # total for phase 1 and its reruns; the start is the running total's, month to date $180.41
            # at 2026-11-21 06:09 UTC). DigitalOcean's figures for the whole account, read every hour with
            # the read-only token below; a progress line each morning, alerts at 80% and 100%.
            - name: VYREON_CORE_SPEND_SINCE
              value: "2026-11-21T06:09:00Z"
            - name: VYREON_CORE_SPEND_BASELINE_USD
              value: "180.41"
            - name: VYREON_CORE_SPEND_CEILING_USD
              value: "750"   # 500 → 750 (owner, 2026-11-26: phase 1 brute force + the fix pass; raise in steps rather than unbounded)
            - name: VYREON_CORE_DO_TOKEN_FILE
              value: /etc/vyreon-core/do-billing/token
            # C-079: after a new build publishes, core republishes the days whose method versions differ
            # from its own (the C-074 planner's choice), scheduled only when its estimated cost at this
            # node-hour price (s-8vcpu-16gb-amd and -intel, DigitalOcean's list price) keeps the spend
            # under the ceiling; else held and alerted. `off`: nothing planned by itself
            # C-094 (audit 2026-11-26; owner: recompute only after the run, by method version): "off" for the
            # phase-1 characterization run. With "on", core starting on this release would decide a held plan
            # before `backfill stop` could be set, and would plan recomputes as soon as the canary's day published
            - name: VYREON_CORE_RECOMPUTE
              value: "off"
            # phase 1's first session: earlier published days (none in this database) wait for the owner
            - name: VYREON_CORE_RECOMPUTE_FROM
              value: "2024-07-09"
            - name: VYREON_CORE_NODE_HOUR_USD
              value: "0.167"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 10
          # a core whose watch has not ticked for 15 min (`/live`, C-053 amended, round x 5) is
          # restarted, so a frozen process never keeps the single-instance lock; a database that
          # is down is the readiness probe's, not a restart's
          livenessProbe:
            httpGet: {path: /live, port: 8080}
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: "500m", memory: 1Gi}
          volumeMounts:
            - {name: spool, mountPath: /var/spool/vyreon-core}
            - {name: webhook, mountPath: /etc/vyreon-core/webhook, readOnly: true}
            - {name: progress-webhook, mountPath: /etc/vyreon-core/progress-webhook, readOnly: true}
            - {name: spaces, mountPath: /etc/vyreon-core/spaces, readOnly: true}
            - {name: do-billing, mountPath: /etc/vyreon-core/do-billing, readOnly: true}
      volumes:
        - name: webhook
          secret: {secretName: vyreon-core-webhook, optional: true, defaultMode: 0440}
        - name: progress-webhook
          secret: {secretName: vyreon-core-progress-webhook, optional: true, defaultMode: 0440}
        # the bucket's key (C-052): core alone holds it; workers get one pre-signed URL per object
        - name: spaces
          secret: {secretName: vyreon-core-spaces, optional: true, defaultMode: 0440}
        # C-078: DigitalOcean's billing, read-only (billing:read); optional
        - name: do-billing
          secret: {secretName: vyreon-core-do-billing, optional: true, defaultMode: 0440}
        # a day's bundle while it is checked: about 200 MB, one at a time
        - name: spool
          emptyDir: {sizeLimit: 4Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: vyreon-core
  namespace: vyreon
spec:
  selector: {app: vyreon-core}
  ports:
    - port: 8080
      targetPort: 8080
