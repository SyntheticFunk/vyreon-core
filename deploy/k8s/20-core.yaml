# vyreon-core: one replica (it is the only writer and publishes one bundle at a time). It migrates
# the database before it serves. Reachable only inside the cluster, as http://vyreon-core:8080.
# Secret `vyreon-core` (made by hand, see README): `worker-token-sha256`. Secret `vyreon-core-webhook`
# (key `webhook`: the Discord channel's webhook URL, made by hand from a file, never printed) is
# mounted read-only; while it is absent the channel's posts wait unsent (C-050). Secret
# `vyreon-core-spaces` (keys `key-id` and `secret`: a Spaces access key limited to the bucket, made
# by hand from files, never printed; README "Perishable archive") is mounted read-only; the archive
# (C-052) is on only when its five settings below are uncommented and the Secret exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vyreon-core
  namespace: vyreon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: vyreon-core}
  template:
    metadata:
      labels: {app: vyreon-core}
    spec:
      # the image's user (deploy/core/Dockerfile): the webhook's file is readable by its group only
      securityContext: {fsGroup: 10001}
      initContainers:
        - name: migrate
          image: VYREON_CORE_IMAGE
          args: ["migrate"]
          env:
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: vyreon-pg-app, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: vyreon-pg-app, key: password}}
            - name: VYREON_CORE_PG
              value: "host=vyreon-pg-rw port=5432 dbname=vyreon user=$(PGUSER) password=$(PGPASSWORD)"
      containers:
        - name: core
          image: VYREON_CORE_IMAGE
          args: ["serve"]
          env:
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: vyreon-pg-app, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: vyreon-pg-app, key: password}}
            - name: VYREON_CORE_PG
              value: "host=vyreon-pg-rw port=5432 dbname=vyreon user=$(PGUSER) password=$(PGPASSWORD)"
            - name: VYREON_CORE_WORKER_TOKEN_SHA256
              valueFrom: {secretKeyRef: {name: vyreon-core, key: worker-token-sha256}}
            - name: VYREON_CORE_LEASE_SECONDS
              value: "600"
            # the owner's channel (C-050)
            - name: VYREON_CORE_WEBHOOK_FILE
              value: /etc/vyreon-core/webhook/webhook
            - name: VYREON_CORE_VOLUME_GIB      # 10-postgres.yaml's storage size
              value: "120"
            # Daily runs (C-051): core queues each session from VYREON_CORE_DAILY_FROM by itself, at
            # 07:30 New York the next calendar day, for the admitted build VYREON_CORE_DAILY_BUILD
            # (both or neither; unset, nothing is queued and the backfill is scheduled by hand).
            # The publishing deadlines (C-050) then start at the same session unless
            # VYREON_CORE_DEADLINES_FROM says otherwise; each session is due by
            # VYREON_CORE_DEADLINE_HOUR (20:00 MT) the next calendar day.
            # - name: VYREON_CORE_DAILY_FROM
            #   value: "YYYY-MM-DD"
            # - name: VYREON_CORE_DAILY_BUILD
            #   value: "<engine build, as `build register` printed it>"
            # - name: VYREON_CORE_DEADLINES_FROM
            #   value: "YYYY-MM-DD"
            - name: VYREON_CORE_DEADLINE_HOUR
              value: "20"
            # The perishable archive (C-052): workers upload a published day's cohort prints and
            # ACT01 pulls to the bucket through URLs core signs with this key (all five or none;
            # off by default). VYREON_CORE_ARCHIVE_FROM: the first session whose published day must
            # have its archives (default: VYREON_CORE_DAILY_FROM); VYREON_CORE_ARCHIVE_ALERT_DAYS:
            # a missing archive older than this is a problem on the channel (unset: only counted
            # in the digest; the provider keeps the prints about five sessions).
            # - name: VYREON_CORE_SPACES_ENDPOINT
            #   value: "https://nyc3.digitaloceanspaces.com"
            # - name: VYREON_CORE_SPACES_REGION
            #   value: "nyc3"
            # - name: VYREON_CORE_SPACES_BUCKET
            #   value: "vyreon-data"
            # - name: VYREON_CORE_SPACES_KEY_ID_FILE
            #   value: /etc/vyreon-core/spaces/key-id
            # - name: VYREON_CORE_SPACES_SECRET_FILE
            #   value: /etc/vyreon-core/spaces/secret
            # - name: VYREON_CORE_ARCHIVE_ALERT_DAYS
            #   value: "2"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 10
          resources:
            requests: {cpu: "500m", memory: 1Gi}
          volumeMounts:
            - {name: spool, mountPath: /var/spool/vyreon-core}
            - {name: webhook, mountPath: /etc/vyreon-core/webhook, readOnly: true}
            - {name: spaces, mountPath: /etc/vyreon-core/spaces, readOnly: true}
      volumes:
        - name: webhook
          secret: {secretName: vyreon-core-webhook, optional: true, defaultMode: 0440}
        # the bucket's key (C-052): core alone holds it; workers get one pre-signed URL per object
        - name: spaces
          secret: {secretName: vyreon-core-spaces, optional: true, defaultMode: 0440}
        # a day's bundle while it is checked: about 200 MB, one at a time
        - name: spool
          emptyDir: {sizeLimit: 4Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: vyreon-core
  namespace: vyreon
spec:
  selector: {app: vyreon-core}
  ports:
    - port: 8080
      targetPort: 8080
