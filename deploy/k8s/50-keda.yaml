# Workers from the queue (C-066; MILESTONES "Before the full build", items 2 and 4). KEDA starts a
# worker Job when core holds claimable work of its kind for its engine build, and nothing otherwise;
# the autoscaled pool `day` brings up a node for a pod that does not fit and removes a node idle for
# about 10 minutes (README, "Workers from the queue"). Nobody applies Jobs, counts completions or
# deletes idle nodes.
#
# Placeholders the operator sets on apply (README):
#   VYREON_WORKER_IMAGE  the worker image (registry.digitalocean.com/vyreon/vyreon-worker:<tag>)
#   VYREON_ENGINE_BUILD  that image's engine build, as `build register` printed it (<commit>+<inventory>)
# The two always change together: a trigger counts only its build's work (a worker claims only its
# own build's jobs), so pods of another image would find nothing. Every other admitted build's
# claimable work (the old build's ordered passes until it is withdrawn) starts no pod here.
#
# Each trigger asks core's database, through the read-only login `vyreon_keda` (group
# `vyreon_scaler`, migration 0046), `core.scaler_count(kind, build, daily)` (C-073, migration 0055):
# the rows of `core.claimable_job` a worker of that build could claim now, except that the work that
# calls the provider (tapes, backfill day blocks, reference-check re-runs) counts nothing while core's
# request budget made a draw wait in the last 5 minutes (`budget::PRESSURE_MINUTES`): KEDA then starts
# no pod the budget cannot feed, and the running ones are untouched (owner, 2026-11-23: the caps are
# no longer tuned by hand from the budget). The daily session's work and the ordered passes always
# count. C-086 (migration 0064): the backfill's day blocks count at most 1, and 0 for 20 minutes after one
# of the build was leased, and, until the build has published one real day with no engine-fault slot, 0
# while one of its backfill blocks runs: they ramp up one at a time, the cap below only a ceiling. C-087:
# while the backfill is stopped (`vyreon-core backfill stop`) its blocks, passes and re-runs count 0.
# C-092 (migration 0066): after the budget's 5 minutes of pressure, the backfill's tapes, re-runs and
# republishes start at most one pod of a kind a minute until 30 minutes from the last wait (a slow start,
# so bursty tapes no longer stop and start all together).
# Under `accurate` a 1 starts one pod (a pod not yet Running is pending and deducted); the one window,
# a pod Running but not yet claimed, may start a second, which then claims a block too (the claim is not
# gated, as C-073's budget). A claimed job leaves the count, so the count is the work no pod holds yet; with
# `targetQueryValue: 1`, one Job per claimable job. (Before 0055 the triggers asked
# `core.claimable_count`, which stays as the plain count: `vyreon-core queue` and the tests read it.)
#
# Scaling (KEDA 2.21, pkg/scaling/executor/scale_jobs.go): strategy `accurate` creates
#   min(claimable - pending Jobs, maxReplicaCount - unfinished Jobs)
# Jobs each poll, where a Job is pending until its pod is Running (or Succeeded). A pod waiting for
# a node, or pulling the image, is pending and holds back the next poll: one claimable job starts one
# pod, not one each 30 seconds while a node comes up. The one window left: a pod Running but not yet
# claimed (the worker claims within a second of starting; 2026-11-22's day pod claimed 0.9 s after
# its container started), so a poll landing in it starts one extra pod, which finds nothing and exits.
#
# Each Job is one pod with no retry (`backoffLimit: 0`; C-040's rule, never a Job-wide limit over
# several pods, holds trivially). A pod that fails before it claims (a Secret key missing, a login
# refused) charges no attempt: KEDA 2.21's ScaledJob has no backoff and no limit on failed Jobs
# (its CRD's spec: pollingInterval, min/maxReplicaCount, the history limits, rollout,
# scalingStrategy, triggers), so such a loop starts a pod every poll while the job stays claimable.
# Bounded by the cap and the pool's nodes; seen on the channel as that kind's STALLED after 15
# minutes (C-065 amended, C-068) and on `ops/health.sh` (failed Jobs and stuck pods); stopped by
# pausing the ScaledJob (README, "Stopping everything"). `failedJobsHistoryLimit` keeps the last 30
# failed Jobs and their pods' logs for the diagnosis. A failed pod's job goes back to core's queue (its `fail`, or its
# lease expiring), and the next poll starts a new Job for it: core's attempts (C-035) are the retry,
# and a Kubernetes retry beside them would start a second pod for the same job.
#
# `rollout.strategy: gradual`: changing a ScaledJob (a new image, a new cap) never deletes running
# Jobs; KEDA's default ("immediate") terminates them, and with them hours of a day block.
#
# Pods are the Job templates of `ops/job-*.yaml` (tape, day block) and `30-workers.yaml` (ordered
# pass): the same labels (`app: vyreon-worker`, `work: <kind>`; `ops/health.sh` reads them), the
# worker toleration, pool `day` preferred and `day-intel` allowed (C-068), the same requests and limits
# (the pass's memory limit is new), `safe-to-evict: "false"`, and
# each pod mounts only the keys it reads (C-016, C-020). Secret `vyreon-worker` (README).
#
# The caps (C-066; change them here and apply again, `gradual` keeps the running Jobs):
#   tape              24  3 a node (2 CPUs of a node's 7.4 free), 8 nodes: the test block's 24 tape
#                         pods on 8 nodes (2026-11-22), 240 tapes in 42 minutes
#   day-block         12  one a node (6 CPUs); the owner's rule: nodes only while the request budget
#                         has headroom; one node drew 101 requests a minute over its wall time and
#                         bursts of 500-760 while a day downloads; core grants at most 1,900 a minute
#                         (VYREON_CORE_INTRINIO_PER_MINUTE), so 12 average 64% of it and their bursts
#                         wait in core's budget, never refused by the provider. Raise it only from
#                         core's request ledger (README).
#   day-block-daily    1  the daily session's block (C-051), outside the backfill's 12 so a
#                         backfill holding every slot for a day and more never delays it
#   ordered-pass       1  date order (C-046): one pass at a time; the claim holds every later pass
#                         behind an unfinished one anyway
#   refcheck           1  C-073: a reference-check re-run, rare (a check whose worker stopped before
#                         it reported); one at a time (core builds its dump in memory)
#   republish          4  C-074: a scoped recompute, one day a pod, beside the blocks in the same
#                         pools (whose maxima stay the cap); held back while the budget is pressed
# Pool `day` max_nodes = 13 (12 day blocks + the daily one): the hard cost cap, 13 x $0.167 an
# hour = $2.17 an hour at most. Pool `day-intel` (the Intel fallback, C-068) autoscaled 0..N. The nodes
# follow the pods and the pods KEDA's caps: 12 + 1 blocks on a node each, 24 tapes three a node (a
# tape does not fit beside a block), passes beside blocks: up to 21 nodes if tapes of later dates run
# while 12 earlier blocks do (round 2, 18), so the pools' maxima (13 + N) are the cap that binds; in
# a newest-first build blocks wait for every earlier tape and the two rarely overlap. README
# "Workers from the queue", 3; N is the owner's. A day-block pod beyond the pool's nodes waits Pending, holding
# nothing (it has not claimed); keep max_nodes >= day-block + day-block-daily.
---
# C-068 (audit opsurface ops.md 6; round 2, 10): the daily session's block is never left without a
# node, and never takes one from a backfill block. The pool's 13 nodes hold at most 12 backfill
# blocks, but tapes (2 CPUs) and passes (1 CPU) may take the 13th node's room, and a block needs 6
# CPUs; a cap alone reserves a Job slot, not CPUs. So the daily block outranks tapes and passes and
# may preempt them (priority 0: minutes of work, their leases expire and the job is claimed again,
# the attempt free, C-035 amended). Backfill blocks carry the SAME value (1000), so the scheduler can
# never evict one for the daily block (preemption takes only lower priorities): where evicting tapes
# or passes does not make room, the daily pod waits Pending and the autoscaler adds a node. Backfill
# blocks preempt nothing (`Never`): they wait for a node.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: vyreon-daily
value: 1000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: "Vyreon: the daily session's day block (C-051, C-068)"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: vyreon-backfill-block
value: 1000
preemptionPolicy: Never
globalDefault: false
description: "Vyreon: a backfill day block; level with the daily block (never evicted for it), preempts nothing (C-068)"
---
# The trigger's database password. A namespaced TriggerAuthentication reads its Secret from its own
# namespace (KEDA 2.21 `resolver.getTriggerAuthSpec`: `TriggerAuthentication` -> the ScaledJob's
# namespace; only a ClusterTriggerAuthentication reads KEDA's namespace), so Secret
# `vyreon-scaler-pg` (key `password`) lives in `vyreon`, made by hand from a file (README).
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: vyreon-scaler-pg
  namespace: vyreon
spec:
  secretTargetRef:
    - {parameter: password, name: vyreon-scaler-pg, key: password}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: tape
  namespace: vyreon
spec:
  pollingInterval: 30
  minReplicaCount: 0
  maxReplicaCount: 12   # 24 → 12 2026-11-23 (phase 1): 24 tapes beside 12 blocks saturated the 1,900 budget; ~18% of tape attempts failed with no bytes
  successfulJobsHistoryLimit: 30
  failedJobsHistoryLimit: 30
  rollout: {strategy: gradual}
  scalingStrategy: {strategy: accurate}
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0
    # a tape takes minutes (2026-11-22: 1.5 to 7); a pod still going after 2 h is stuck: stopped,
    # its lease expires and the job is queued again (an attempt, C-035)
    activeDeadlineSeconds: 7200
    template:
      metadata:
        labels: {app: vyreon-worker, work: tape}
        annotations:
          # the autoscaler never removes a node under a running worker (C-051)
          cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      spec:
        restartPolicy: Never
        serviceAccountName: default
        imagePullSecrets:
          - {name: regcred}
        # pool `day` (AMD) first, `day-intel` (Intel) when `day` cannot have a node (C-068: nyc1 has
        # refused AMD capacity; the autoscaler backs a pool off after a failed scale-up and grows the
        # other); both carry the label and the taint
        nodeSelector: {vyreon: worker}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - {key: doks.digitalocean.com/node-pool, operator: In, values: [day, day-intel]}
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - {key: doks.digitalocean.com/node-pool, operator: In, values: [day]}
        tolerations:
          - {key: vyreon, operator: Equal, value: worker, effect: NoSchedule}
        containers:
          - name: worker
            image: VYREON_WORKER_IMAGE
            args: ["run", "tape", "--bin", "/opt/vyreon/bin", "--repo", "/opt/vyreon/bin"]
            env:
              - {name: VYREON_HOME, value: /work}
              - {name: VYREON_CORE_URL, value: "http://vyreon-core:8080"}
              - {name: VYREON_CORE_WORKER_TOKEN_FILE, value: /secrets/worker-token}
              - {name: VYREON_KEY_FILE, value: /secrets/intrinio-key}
              - {name: VYREON_FRED_KEY_FILE, value: /secrets/fred-key}
              - name: VYREON_WORKER_NAME
                valueFrom: {fieldRef: {fieldPath: metadata.name}}
            resources:
              requests: {cpu: "2", memory: 3Gi}   # D-459 (engine fc36eefb): bounded capture + streamed verdict, ~1 GB each on a full day
              limits: {memory: 6Gi}               # tripwire: a regression fails visibly (OOMKilled) instead of starving the node
            volumeMounts:
              - {name: work, mountPath: /work}
              - {name: secrets, mountPath: /secrets, readOnly: true}
        volumes:
          - name: work
            emptyDir: {}
          # only the keys this pod reads: the ordered pass's database login stays with the ordered
          # pass (C-016, C-020)
          - name: secrets
            secret:
              secretName: vyreon-worker
              defaultMode: 0400
              items:
                - {key: worker-token, path: worker-token}
                - {key: intrinio-key, path: intrinio-key}
                - {key: fred-key, path: fred-key}
  triggers:
    - type: postgresql
      name: claimable-tapes
      authenticationRef: {name: vyreon-scaler-pg}
      metadata:
        host: vyreon-pg-rw.vyreon.svc.cluster.local
        port: "5432"
        userName: vyreon_keda
        dbName: vyreon
        sslmode: require
        query: "SELECT core.scaler_count('TAPE', 'VYREON_ENGINE_BUILD')"
        targetQueryValue: "1"
        activationTargetQueryValue: "0"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: day-block
  namespace: vyreon
spec:
  pollingInterval: 30
  minReplicaCount: 0
  maxReplicaCount: 12  # 8 → 12 2026-11-26 (owner): the ceiling only; core's ramp (C-086: one new block every 20 min, one at a time until the build published a real day clean) and the budget's pressure decide how many run (12 → 8 2026-11-23 when 12 started at once saturated the budget)
  successfulJobsHistoryLimit: 30
  failedJobsHistoryLimit: 30
  rollout: {strategy: gradual}
  scalingStrategy: {strategy: accurate}
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0
    # a block of 15 sessions: about 226 min for its first day and 120-134 for each later one
    # (2026-11-21), about 35 h; a pod still going after 72 h is stuck: stopped, its lease expires
    # and the block resumes at its next session on a new pod (an attempt, C-035)
    activeDeadlineSeconds: 259200
    template:
      metadata:
        labels: {app: vyreon-worker, work: day-block}
        annotations:
          # a day is hours of work; the node is not drained under it
          cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      spec:
        restartPolicy: Never
        priorityClassName: vyreon-backfill-block
        serviceAccountName: default
        imagePullSecrets:
          - {name: regcred}
        # pool `day` (AMD) first, `day-intel` (Intel) when `day` cannot have a node (C-068: nyc1 has
        # refused AMD capacity; the autoscaler backs a pool off after a failed scale-up and grows the
        # other); both carry the label and the taint
        nodeSelector: {vyreon: worker}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - {key: doks.digitalocean.com/node-pool, operator: In, values: [day, day-intel]}
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - {key: doks.digitalocean.com/node-pool, operator: In, values: [day]}
        tolerations:
          - {key: vyreon, operator: Equal, value: worker, effect: NoSchedule}
        containers:
          - name: worker
            image: VYREON_WORKER_IMAGE
            args: ["run", "day-block", "--bin", "/opt/vyreon/bin", "--repo", "/opt/vyreon/bin"]
            env:
              - {name: VYREON_HOME, value: /work}
              - {name: VYREON_REFCHECK_MINUTES, value: "600"}
              # C-102 (2026-11-28): the reference suite's processes. Unset, the worker takes the node's 8 processors;
              # on the 2024-09..2025-02 dates each suite process held ~1.5 GiB and the worker ~1.7 GiB, so 8 is 13.9 GiB
              # against this pod's 12 GiB (four workers OOMKilled in a check, 11-27/28). 6 is 10.9 GiB.
              - {name: VYREON_REFCHECK_JOBS, value: "6"}
              - {name: VYREON_OPTION_EOD_SOURCE, value: bulk}
              - {name: VYREON_ACT01_IN_FLIGHT, value: "2"}   # 2026-11-23 phase 1: ACT01 cohorts ran past their 180 s window under the shared budget
              - {name: VYREON_OVERLAP_SURFACES, value: "off"}   # C-085: speed-only overlaps off (engine D-405), lowering a day's memory peak
              - {name: VYREON_OVERLAP_FIELD, value: "off"}
              - {name: VYREON_CORE_URL, value: "http://vyreon-core:8080"}
              - {name: VYREON_CORE_WORKER_TOKEN_FILE, value: /secrets/worker-token}
              - {name: VYREON_KEY_FILE, value: /secrets/intrinio-key}
              - {name: VYREON_FRED_KEY_FILE, value: /secrets/fred-key}
              - name: VYREON_WORKER_NAME
                valueFrom: {fieldRef: {fieldPath: metadata.name}}
            resources:
              requests: {cpu: "6", memory: 12Gi}   # 10 → 12Gi 2026-11-26 (pass 1): at 10Gi a tape (3Gi) was co-scheduled beside a block
              limits: {memory: 12Gi}               # 14 → 12Gi 2026-11-26 (C-085): the node evicts at ~12.4-13.0 GiB (system ~3 GiB of 15.6); the engine sizes itself to this limit
            volumeMounts:
              - {name: work, mountPath: /work}
              - {name: secrets, mountPath: /secrets, readOnly: true}
        volumes:
          - name: work
            emptyDir: {}
          # only the keys this pod reads: the ordered pass's database login stays with the ordered
          # pass (C-016, C-020)
          - name: secrets
            secret:
              secretName: vyreon-worker
              defaultMode: 0400
              items:
                - {key: worker-token, path: worker-token}
                - {key: intrinio-key, path: intrinio-key}
                - {key: fred-key, path: fred-key}
  triggers:
    # the backfill's and by-hand blocks only: a daily session's block is day-block-daily's, so the
    # two never start a pod each for the same job (a pod of this ScaledJob still takes a daily block
    # first if one is claimable when it claims, C-051)
    - type: postgresql
      name: claimable-blocks
      authenticationRef: {name: vyreon-scaler-pg}
      metadata:
        host: vyreon-pg-rw.vyreon.svc.cluster.local
        port: "5432"
        userName: vyreon_keda
        dbName: vyreon
        sslmode: require
        query: "SELECT core.scaler_count('DAY_BLOCK', 'VYREON_ENGINE_BUILD', false)"
        targetQueryValue: "1"
        activationTargetQueryValue: "0"
---
# The daily session's block (C-051): core queues it at 07:30 New York the next calendar day; this
# starts its pod within a poll, beside the backfill's slots. Its pod claims only the daily runs' jobs
# (`VYREON_WORKER_DAILY` "0": daily only, asked once), never a backfill block, so the daily slot is
# never held for a day and more. Replaces CronJob `daily` (40-daily.yaml) once
# VYREON_CORE_DAILY_BUILD is this file's build (README, "Workers from the queue": the daily runs).
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: day-block-daily
  namespace: vyreon
spec:
  pollingInterval: 30
  minReplicaCount: 0
  maxReplicaCount: 1
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 10
  rollout: {strategy: gradual}
  scalingStrategy: {strategy: accurate}
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0
    # one session: 5 h 50 min measured from an empty disk; stopped at 23 h as the CronJob's run was
    activeDeadlineSeconds: 82800
    template:
      metadata:
        labels: {app: vyreon-worker, work: day-block, daily: "true"}
        annotations:
          cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      spec:
        restartPolicy: Never
        priorityClassName: vyreon-daily
        serviceAccountName: default
        imagePullSecrets:
          - {name: regcred}
        # pool `day` (AMD) first, `day-intel` (Intel) when `day` cannot have a node (C-068: nyc1 has
        # refused AMD capacity; the autoscaler backs a pool off after a failed scale-up and grows the
        # other); both carry the label and the taint
        nodeSelector: {vyreon: worker}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - {key: doks.digitalocean.com/node-pool, operator: In, values: [day, day-intel]}
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - {key: doks.digitalocean.com/node-pool, operator: In, values: [day]}
        tolerations:
          - {key: vyreon, operator: Equal, value: worker, effect: NoSchedule}
        containers:
          - name: worker
            image: VYREON_WORKER_IMAGE
            args: ["run", "day-block", "--bin", "/opt/vyreon/bin", "--repo", "/opt/vyreon/bin"]
            env:
              - {name: VYREON_WORKER_DAILY, value: "0"}
              - {name: VYREON_HOME, value: /work}
              - {name: VYREON_REFCHECK_MINUTES, value: "600"}
              # C-102 (2026-11-28): the reference suite's processes. Unset, the worker takes the node's 8 processors;
              # on the 2024-09..2025-02 dates each suite process held ~1.5 GiB and the worker ~1.7 GiB, so 8 is 13.9 GiB
              # against this pod's 12 GiB (four workers OOMKilled in a check, 11-27/28). 6 is 10.9 GiB.
              - {name: VYREON_REFCHECK_JOBS, value: "6"}
              - {name: VYREON_OPTION_EOD_SOURCE, value: bulk}
              - {name: VYREON_ACT01_IN_FLIGHT, value: "2"}   # 2026-11-23 phase 1: ACT01 cohorts ran past their 180 s window under the shared budget
              - {name: VYREON_OVERLAP_SURFACES, value: "off"}   # C-085: speed-only overlaps off (engine D-405), lowering a day's memory peak
              - {name: VYREON_OVERLAP_FIELD, value: "off"}
              - {name: VYREON_CORE_URL, value: "http://vyreon-core:8080"}
              - {name: VYREON_CORE_WORKER_TOKEN_FILE, value: /secrets/worker-token}
              - {name: VYREON_KEY_FILE, value: /secrets/intrinio-key}
              - {name: VYREON_FRED_KEY_FILE, value: /secrets/fred-key}
              - name: VYREON_WORKER_NAME
                valueFrom: {fieldRef: {fieldPath: metadata.name}}
            resources:
              requests: {cpu: "6", memory: 12Gi}   # 10 → 12Gi 2026-11-26 (pass 1): at 10Gi a tape (3Gi) was co-scheduled beside a block
              limits: {memory: 12Gi}               # 14 → 12Gi 2026-11-26 (C-085): the node evicts at ~12.4-13.0 GiB (system ~3 GiB of 15.6); the engine sizes itself to this limit
            volumeMounts:
              - {name: work, mountPath: /work}
              - {name: secrets, mountPath: /secrets, readOnly: true}
        volumes:
          - name: work
            emptyDir: {}
          - name: secrets
            secret:
              secretName: vyreon-worker
              defaultMode: 0400
              items:
                - {key: worker-token, path: worker-token}
                - {key: intrinio-key, path: intrinio-key}
                - {key: fred-key, path: fred-key}
  triggers:
    - type: postgresql
      name: claimable-daily-blocks
      authenticationRef: {name: vyreon-scaler-pg}
      metadata:
        host: vyreon-pg-rw.vyreon.svc.cluster.local
        port: "5432"
        userName: vyreon_keda
        dbName: vyreon
        sslmode: require
        query: "SELECT core.scaler_count('DAY_BLOCK', 'VYREON_ENGINE_BUILD', true)"
        targetQueryValue: "1"
        activationTargetQueryValue: "0"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: ordered-pass
  namespace: vyreon
spec:
  pollingInterval: 30
  minReplicaCount: 0
  # one day at a time, in date order (C-046): never parallel
  maxReplicaCount: 1
  successfulJobsHistoryLimit: 30
  failedJobsHistoryLimit: 30
  rollout: {strategy: gradual}
  scalingStrategy: {strategy: accurate}
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0
    # a pass reads the published store and computes one session: seconds on the test block's 10
    # days, not measured at the full range (597); a pod still going after 2 h is stuck: stopped, its
    # lease expires and the pass is queued again (free twice, then an attempt: C-035 amended).
    # Measured, and raised if need be, on the recompute and the full build (README "The caps")
    activeDeadlineSeconds: 7200
    template:
      metadata:
        labels: {app: vyreon-worker, work: ordered-pass}
        annotations:
          # the autoscaler never removes a node under a running worker (C-051)
          cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      spec:
        restartPolicy: Never
        serviceAccountName: default
        imagePullSecrets:
          - {name: regcred}
        # pool `day` (AMD) first, `day-intel` (Intel) when `day` cannot have a node (C-068: nyc1 has
        # refused AMD capacity; the autoscaler backs a pool off after a failed scale-up and grows the
        # other); both carry the label and the taint
        nodeSelector: {vyreon: worker}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - {key: doks.digitalocean.com/node-pool, operator: In, values: [day, day-intel]}
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - {key: doks.digitalocean.com/node-pool, operator: In, values: [day]}
        tolerations:
          - {key: vyreon, operator: Equal, value: worker, effect: NoSchedule}
        containers:
          - name: worker
            image: VYREON_WORKER_IMAGE
            args: ["run", "ordered-pass", "--bin", "/opt/vyreon/bin", "--repo", "/opt/vyreon/bin"]
            env:
              - {name: VYREON_HOME, value: /work}
              - {name: VYREON_CORE_URL, value: "http://vyreon-core:8080"}
              - {name: VYREON_CORE_WORKER_TOKEN_FILE, value: /secrets/worker-token}
              - {name: VYREON_CORE_PG_RO_FILE, value: /secrets/ordered-pass-pg}
              - name: VYREON_WORKER_NAME
                valueFrom: {fieldRef: {fieldPath: metadata.name}}
            # memory request = limit (C-068 round 2, suspicion 20): the scheduler reserves what the
            # pass may use, so a pass and a block (10Gi request) fit the node's 13.3 GiB allocatable
            # together, and under memory pressure the kubelet evicts pods above their requests first
            # (the pass never is). 3Gi is three times the ~1 GB estimated at the full range
            # (MILESTONES), until measured (README "The caps"); raised, it must stay <= 3.2Gi to sit
            # beside a block, else passes take a node of their own
            resources:
              requests: {cpu: "1", memory: 3Gi}
              limits: {memory: 3Gi}
            volumeMounts:
              - {name: work, mountPath: /work}
              - {name: secrets, mountPath: /secrets, readOnly: true}
        volumes:
          - name: work
            emptyDir: {}
          # only the keys this pod reads: it calls no provider
          - name: secrets
            secret:
              secretName: vyreon-worker
              defaultMode: 0400
              items:
                - {key: worker-token, path: worker-token}
                - {key: ordered-pass-pg, path: ordered-pass-pg}
  triggers:
    # every claimable pass of the build, the daily session's among them (it waits for the backfill's
    # earlier passes by the claim's own rule, C-051)
    - type: postgresql
      name: claimable-passes
      authenticationRef: {name: vyreon-scaler-pg}
      metadata:
        host: vyreon-pg-rw.vyreon.svc.cluster.local
        port: "5432"
        userName: vyreon_keda
        dbName: vyreon
        sslmode: require
        query: "SELECT core.scaler_count('ORDERED_PASS', 'VYREON_ENGINE_BUILD')"
        targetQueryValue: "1"
        activationTargetQueryValue: "0"
---
# C-073: a reference-check re-run (job kind REFCHECK). Core's watch queues one for a published day whose
# check never completed (its worker stopped before it reported: a hand-over, a lost node; or it timed
# out or crashed), 6 hours after the day was published and once its worker's lease has ended. The
# worker (`vyreon-worker run refcheck`, engine spec in docs/DECISIONS.md C-073) computes the day again
# in a scratch home without publishing it (the suite reads the day's raw inputs and surfaces, which
# no worker keeps), reads the revisions to check from core as the suite's dump, runs the suite and
# reports. So its pod is a day block's: the same keys, requests and node; one at a time. A re-run
# that fails too is the owner's (REFCHECK_NOT_RUN).
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: refcheck
  namespace: vyreon
spec:
  pollingInterval: 30
  minReplicaCount: 0
  maxReplicaCount: 1
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 10
  rollout: {strategy: gradual}
  scalingStrategy: {strategy: accurate}
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0
    # a day's download and compute (about 6 h from an empty disk) and the suite's deadline (10 h);
    # a pod still going after 24 h is stuck: its lease expires and the re-run is claimed again
    activeDeadlineSeconds: 86400
    template:
      metadata:
        labels: {app: vyreon-worker, work: refcheck}
        annotations:
          cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      spec:
        restartPolicy: Never
        priorityClassName: vyreon-backfill-block
        serviceAccountName: default
        imagePullSecrets:
          - {name: regcred}
        nodeSelector: {vyreon: worker}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - {key: doks.digitalocean.com/node-pool, operator: In, values: [day, day-intel]}
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - {key: doks.digitalocean.com/node-pool, operator: In, values: [day]}
        tolerations:
          - {key: vyreon, operator: Equal, value: worker, effect: NoSchedule}
        containers:
          - name: worker
            image: VYREON_WORKER_IMAGE
            args: ["run", "refcheck", "--bin", "/opt/vyreon/bin", "--repo", "/opt/vyreon/bin"]
            env:
              - {name: VYREON_HOME, value: /work}
              - {name: VYREON_REFCHECK_MINUTES, value: "600"}
              # C-102 (2026-11-28): the reference suite's processes. Unset, the worker takes the node's 8 processors;
              # on the 2024-09..2025-02 dates each suite process held ~1.5 GiB and the worker ~1.7 GiB, so 8 is 13.9 GiB
              # against this pod's 12 GiB (four workers OOMKilled in a check, 11-27/28). 6 is 10.9 GiB.
              - {name: VYREON_REFCHECK_JOBS, value: "6"}
              - {name: VYREON_OPTION_EOD_SOURCE, value: bulk}
              - {name: VYREON_ACT01_IN_FLIGHT, value: "2"}
              - {name: VYREON_CORE_URL, value: "http://vyreon-core:8080"}
              - {name: VYREON_CORE_WORKER_TOKEN_FILE, value: /secrets/worker-token}
              - {name: VYREON_KEY_FILE, value: /secrets/intrinio-key}
              - {name: VYREON_FRED_KEY_FILE, value: /secrets/fred-key}
              - name: VYREON_WORKER_NAME
                valueFrom: {fieldRef: {fieldPath: metadata.name}}
            resources:
              requests: {cpu: "6", memory: 12Gi}   # 10 → 12Gi 2026-11-26 (pass 1): at 10Gi a tape (3Gi) was co-scheduled beside a block
              limits: {memory: 12Gi}               # 14 → 12Gi 2026-11-26 (C-085): the node evicts at ~12.4-13.0 GiB (system ~3 GiB of 15.6); the engine sizes itself to this limit
            volumeMounts:
              - {name: work, mountPath: /work}
              - {name: secrets, mountPath: /secrets, readOnly: true}
        volumes:
          - name: work
            emptyDir: {}
          - name: secrets
            secret:
              secretName: vyreon-worker
              defaultMode: 0400
              items:
                - {key: worker-token, path: worker-token}
                - {key: intrinio-key, path: intrinio-key}
                - {key: fred-key, path: fred-key}
  triggers:
    - type: postgresql
      name: claimable-refchecks
      authenticationRef: {name: vyreon-scaler-pg}
      metadata:
        host: vyreon-pg-rw.vyreon.svc.cluster.local
        port: "5432"
        userName: vyreon_keda
        dbName: vyreon
        sslmode: require
        query: "SELECT core.scaler_count('REFCHECK', 'VYREON_ENGINE_BUILD')"
        targetQueryValue: "1"
        activationTargetQueryValue: "0"
---
# C-074: a scoped recompute (job kind REPUBLISH), scheduled by `vyreon-core republish`. Its worker
# (`vyreon-worker run republish`, engine D-462) fetches the inputs its scope's stages read, computes
# the recompute set and publishes copy-forward revisions of the day. Its pod is a day block's: the
# same keys, requests and node pools (the pools' maxima stay the cost cap that binds); at most 4 at
# once (owner's to change), held back like the backfill while the request budget is pressed.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: republish
